training:
  seed: 42
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001

  optimizer:
    name: AdamW
  loss:
    name: CrossEntropyLoss
  scheduler:
    enabled: true

  mixed_precision:
    enabled: false             # GTX 1050 Ti has no tensor cores; enable only if benchmarks show a gain

  cudnn:
    benchmark: true
    deterministic: false

  dataloader:
    num_workers: 2
    pin_memory: true
    persistent_workers: true
    drop_last: false

  early_stopping:
    enabled: true
    patience: 10

  checkpoint:
    save_best: true
    save_latest: true
