[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-classifier"
version = "0.1.0"
description = "Modular CNN image classifier for experimenting with sampling and activation functions"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "torchvision",
    "joblib",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "tensorboard",
]
# torch and torchvision are installed separately (see SETUP.md) to pick the cu126 build.

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["model*", "training*", "evaluation*", "analysis*", "experimentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
